name: Auto Pluto Update

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 18
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js

      - name: Commit files
        run: |
          echo "Comprobando XML de Argentina:"
          ls -lh output/plutotv_ar.xml
          git check-ignore -v output/plutotv_ar.xml || true

          git add -f output/plutotv_ar.xml
          git add .

          echo "Archivos preparados para guardar:"
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --cached --quiet; then
            git commit -m "Auto update playlist"
            git push
          else
            echo "No changes"
          fi
